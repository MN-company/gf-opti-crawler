services:
  crawler:
    build: .
    environment:
      RECIPE_SCRAPER_USER_AGENT: ${RECIPE_SCRAPER_USER_AGENT:-RecipeArchiveResearchBot/0.8.1}
    volumes:
      - ./data:/app/data
    init: true
  crawler-browser:
    profiles: [browser]
    build:
      context: .
      dockerfile: Dockerfile.browser
    environment:
      RECIPE_SCRAPER_USER_AGENT: ${RECIPE_SCRAPER_USER_AGENT:-RecipeArchiveResearchBot/0.8.1}
    volumes:
      - ./data:/app/data
    init: true
    shm_size: "512mb"
